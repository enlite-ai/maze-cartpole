# pyproject.toml for maze-cartpole
[build-system]
requires = ['setuptools<81.0.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'maze-cartpole'
version = '0.0.3.dev1'
description = ''
readme = { file = 'README.md', content-type = 'text/markdown' }
authors = [{ name = 'enliteAI GmbH', email = 'office@enlite.ai' }]
urls = { Homepage = 'https://enlite.ai', Repository = 'https://github.com/enlite-ai/maze-cartpole' }
requires-python = '>=3.10, <3.14'
dependencies = [
    'maze-rl',
]

[tool.setuptools.packages.find]
# Start package search from the current directory
where = ['.']
# Use patterns
include = ['maze_cartpole', 'maze_cartpole.*', 'hydra_plugins']
# Enable namespace discovery (similar to find_namespace_packages)
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 120
force-exclude = true

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'B', 'ARG', 'SLF']

ignore = ['E203']
per-file-ignores = { '**/__init__.py' = ['F401'] }

[tool.ruff.lint.pylint]
max-branches = 15
max-args = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
section-order = ['future', 'standard-library', 'first-party', 'third-party', 'local-folder']
required-imports = ['from __future__ import annotations']

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true
